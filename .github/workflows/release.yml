name: Release

# Push a SemVer tag such as v0.2.0 or v0.2.0-preview.1 to create a GitHub release
# with that commit's packages attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: artifacts

      - name: Check package version matches tag
        run: |
          expected="StarCitizen.LocalTelemetry.${GITHUB_REF_NAME#v}.nupkg"
          ls artifacts
          test -f "artifacts/$expected" || { echo "::error::Expected artifacts/$expected"; exit 1; }

      # To publish to nuget.org: add an API key as the repository secret NUGET_API_KEY and uncomment.
      # - name: Publish to nuget.org
      #   run: >
      #     dotnet nuget push "artifacts/*.nupkg"
      #     --source https://api.nuget.org/v3/index.json
      #     --api-key "${{ secrets.NUGET_API_KEY }}"
      #     --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Use the matching CHANGELOG.md section as release notes, if there is one.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md || true
          args=()
          [[ "$version" == *-* ]] && args+=(--prerelease)
          if [ -s notes.md ]; then args+=(--notes-file notes.md); else args+=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --verify-tag "${args[@]}"