name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # The Telemetry Explorer sample (referenced by the tests) uses Windows-only UI packages.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore StarCitizen.LocalTelemetry.slnx

      - name: Build
        run: dotnet build StarCitizen.LocalTelemetry.slnx -c Release --no-restore

      - name: Check formatting
        run: dotnet format StarCitizen.LocalTelemetry.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --solution StarCitizen.LocalTelemetry.slnx -c Release --no-build

      # Always pack to catch packaging errors, but only keep packages from tag (release) builds.
      - name: Pack
        run: dotnet pack src/StarCitizen.LocalTelemetry/StarCitizen.LocalTelemetry.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: nuget
          path: artifacts/*
          if-no-files-found: error
